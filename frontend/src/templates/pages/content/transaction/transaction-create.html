<div class="income-expenses-create-edit">
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-8">
                    <h3 class="m-0 content-title">Создание дохода/расхода</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="create-edit-block">
        <select name="type" id="type" class="form-control create-edit-input">
            <option value="income">Доход</option>
            <option value="expense">Расход</option>
        </select>
        <select name="category" id="category" class="form-control create-edit-input">
        </select>
        <input type="number" id="amount" class="form-control create-edit-input" placeholder="Сумма в $...">
        <span id="amount-error" class="error invalid-feedback">Значение не может быть пустым</span>
        <input type="date" id="date" class="form-control create-edit-input" placeholder="Дата...">
        <span id="date-error" class="error invalid-feedback">Значение не может быть пустым</span>
        <input type="text" id="comment" class="form-control create-edit-input" placeholder="Комментарий...">
        <span id="comment-error" class="error invalid-feedback">Значение не может быть пустым</span>
        <div class="confirmation-buttons">
            <button class="confirmation-button btn btn-success" type="button" id="save">
                Создать
            </button>
            <a href="/transaction" class="confirmation-button btn btn-danger" type="button" id="no-delete">
                Отмена
            </a>
        </div>
    </div>
</div>
