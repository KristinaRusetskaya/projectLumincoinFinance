<div class="home">
    <div class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-8">
                    <h3 class="m-0 content-title">Главная</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="date-buttons" id="buttons-interval">
        <button type="button" class="btn btn-outline-secondary date-button" id="today">Сегодня</button>
        <button type="button" class="btn btn-outline-secondary date-button" id="week">Неделя</button>
        <button type="button" class="btn btn-outline-secondary date-button" id="month">Месяц</button>
        <button type="button" class="btn btn-outline-secondary date-button" id="year">Год</button>
        <button type="button" class="btn btn-outline-secondary date-button" id="all">Все</button>
        <button type="button" class="btn btn-outline-secondary date-button" id="interval">Интервал</button>
        <div class="date-interval">
            <div class="date-section" id="date-from-section">
                <div class="date-section-buttons">
                    <button type="button" id="date-from-save">
                        <svg width="20px" height="20px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                            <!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                            <path fill="#6c757d"
                                  d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/>
                        </svg>
                    </button>
                    <button type="button" id="date-from-cancel">
                        <svg width="20px" height="20px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                            <!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                            <path fill="#6c757d"
                                  d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
                        </svg>
                    </button>
                </div>
                <input type="date" class="date-input" id="date-from-input">
            </div>
            <div class="date-section date-to" id="date-to-section">
                <div class="date-section-buttons">
                    <button type="button" id="date-to-save">
                        <svg width="20px" height="20px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                            <!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                            <path fill="#6c757d"
                                  d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/>
                        </svg>
                    </button>
                    <button type="button" id="date-to-cancel">
                        <svg width="20px" height="20px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                            <!--!Font Awesome Free 6.6.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.-->
                            <path fill="#6c757d"
                                  d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
                        </svg>
                    </button>
                </div>
                <input type="date" class="date-input" id="date-to-input">
            </div>
            <div>c <span class="interval-date" id="date-from">Дата</span> по <span class="interval-date" id="date-to">Дата</span></div>
        </div>
    </div>
    <div class="home-diagrams">
        <div class="home-diagram">
            <div class="home-diagram-name">
                Доходы
            </div>
            <div class="first-diagram" id="first-diagram">
                <canvas id="pieChartFirst" width="500" height="500"></canvas>
            </div>
        </div>
        <div class="home-diagram">
            <div class="home-diagram-name">
                Расходы
            </div>
            <div class="second-diagram" id="second-diagram">
                <canvas id="pieChartSecond" width="500" height="500"></canvas>
            </div>
        </div>
    </div>
</div>
